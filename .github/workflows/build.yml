name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK Build Tools
      run: |
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
        echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> $GITHUB_ENV
        ANDROID_JAR=$(ls -d $ANDROID_HOME/platforms/android-* | tail -n 1)/android.jar
        echo "ANDROID_JAR=$ANDROID_JAR" >> $GITHUB_ENV

    - name: Download Binary
      run: |
        mkdir -p app/src/main/assets
        curl -L -o app/src/main/assets/android-client-v8a https://github.com/tagh6668-dot/whitelist-bypass-iran/releases/download/v1.0.0-4/android-client-v8a

    - name: Compile Java
      run: |
        mkdir -p obj
        javac -classpath ${{ env.ANDROID_JAR }} -d obj app/src/main/java/com/bypass/*.java

    - name: Dex Compilation
      run: |
        mkdir -p bin
        ${{ env.BUILD_TOOLS_DIR }}/d8 --output bin/ obj/com/bypass/*.class --lib ${{ env.ANDROID_JAR }}

    - name: Compile Resources (Asset and Manifest Only)
      run: |
        ${{ env.BUILD_TOOLS_DIR }}/aapt2 link -o bin/app-unsigned.apk \
          -I ${{ env.ANDROID_JAR }} \
          --manifest app/src/main/AndroidManifest.xml \
          -A app/src/main/assets \
          --target-sdk-version 33 \
          --min-sdk-version 26

    - name: Add Dex to APK
      run: |
        cd bin
        zip -u app-unsigned.apk classes.dex

    - name: Sign APK
      run: |
        keytool -genkeypair -v -keystore my.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=bypass, O=bypass, C=US"
        ${{ env.BUILD_TOOLS_DIR }}/apksigner sign --ks my.keystore --ks-key-alias mykey --ks-pass pass:123456 --key-pass pass:123456 --out BypassClient.apk app-unsigned.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BypassClient
        path: bin/BypassClient.apk
